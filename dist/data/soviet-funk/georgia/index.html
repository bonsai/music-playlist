<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Georgia Prog 1975 — YouTube</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;background:#111;color:#eee}
h1{margin-bottom:8px}.grid{display:grid;gap:18px}.card{background:#1d1d1d;padding:16px;border-radius:12px}
.thumb{display:block}.thumb img,.placeholder{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
.placeholder{display:grid;place-items:center;background:#333;color:#fff;font-size:3rem;text-align:center}
.placeholder small{font-size:1rem}.meta{color:#aaa;font-size:.9rem}
a{color:#8ec5ff}
</style>
</head>
<body>
<h1>Georgia Prog / Psych — 1975</h1>
<p>Georgian SSR の1975年前後。YouTubeサムネイル付き。</p>
<div id="app" class="grid"></div>
<script>
const records=[
 {artist:"Iveria",title:"Иверия",year:1975,videoId:"7nBCaqCv-Gc"},
 {artist:"Kolkheti",title:"Колхети",year:1975},
 {artist:"Aisi",title:"აისი",year:1975},
 {artist:"Dielo",title:"Dielo 75’",year:1975,videoId:"bg7YyYcXUMc"},
 {artist:"YouTube",title:"oiDxug4D8Fs",year:1975,videoId:"oiDxug4D8Fs"},
 {artist:"VIA-75",title:"Оровела",year:1976,recorded:1975}
];
const app=document.querySelector("#app");
app.innerHTML=records.map(r=>{
 const url=r.videoId
  ? "https://www.youtube.com/watch?v="+r.videoId
  : "https://www.youtube.com/results?search_query="+encodeURIComponent(r.artist+" "+r.title);
 const thumb=r.videoId
  ? '<img src="https://i.ytimg.com/vi/'+r.videoId+'/hqdefault.jpg" alt="'+r.artist+' '+r.title+' YouTube thumbnail" loading="lazy">'
  : '<div class="placeholder">▶<br><small>YouTube検索</small></div>';
 return '<article class="card"><a class="thumb" href="'+url+'" target="_blank" rel="noopener">'+thumb+'</a><h2>'+r.artist+' — '+r.title+'</h2><div class="meta">'+r.year+(r.recorded?" / recorded "+r.recorded:"")+'</div></article>';
}).join("");
</script>
</body>
</html>
