<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soviet Funk — YouTube</title>
<style>
body{margin:0;background:#111;color:#eee;font:15px system-ui,sans-serif}
header{position:sticky;top:0;background:#111;border-bottom:1px solid #333;padding:16px;z-index:2}
h1{margin:0 0 10px;font-size:22px}.meta{color:#999}
main{max-width:1100px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#1b1b1b;border:1px solid #333;border-radius:10px;overflow:hidden}
.thumb{display:block;aspect-ratio:16/9;background:#222}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:12px}.artist{font-weight:700;font-size:18px}.tags{color:#aaa;margin-top:6px}
a{color:inherit;text-decoration:none}.empty{padding:30px;color:#999}
</style>
</head>
<body>
<header><h1>Soviet Funk / Prog — YouTube</h1><div class="meta" id="meta"></div></header>
<main><div class="grid" id="app"></div></main>
<script>
const DATA_URL="artists.jsonl";
async function load(){
 const text=await fetch(DATA_URL).then(r=>r.text());
 const rows=text.trim().split(/\n/).filter(Boolean).map(JSON.parse);
 const yt=rows.filter(x=>x.youtubeId);
 document.querySelector("#meta").textContent=
   yt.length+" / "+rows.length+" artists have YouTube videos";
 document.querySelector("#app").innerHTML=yt.map(x=>{
   const id=x.youtubeId;
   return '<article class="card">'+
    '<a class="thumb" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+id+'">'+
    '<img loading="lazy" src="https://i.ytimg.com/vi/'+id+'/hqdefault.jpg" alt="'+x.artist+'">'+
    '</a><div class="info">'+
    '<div class="artist">'+x.artist+'</div>'+
    '<div class="tags">'+(x.country||"")+" · "+(x.genres||[]).join(" · ")+'</div>'+
    '</div></article>';
 }).join("") || '<div class="empty">YouTube video がまだありません。</div>';
}
load();
</script>
</body>
</html>
